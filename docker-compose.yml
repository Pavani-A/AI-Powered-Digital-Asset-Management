services:

  postgres:
    image: postgres:18
    container_name: dam-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam_user
      POSTGRES_PASSWORD: dam_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dam_user -d dam"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  qdrant:
    image: qdrant/qdrant:latest
    container_name: dam-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:

  postgres_data:

  qdrant_data: